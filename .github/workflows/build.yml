name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Unpack project
        run: |
          ls -l tm-* 2>/dev/null || true
          if [ -f tm-project.zip ]; then echo "USING ZIP"; unzip -oq tm-project.zip
          elif [ -f tm-project.tar.gz ]; then echo "USING TAR.GZ"; tar xzf tm-project.tar.gz
          elif [ -f tm-project.b64.txt ]; then echo "USING B64"; base64 -d tm-project.b64.txt | tar xz
          elif ls tm-part-*.txt >/dev/null 2>&1; then echo "USING PARTS"; cat tm-part-*.txt | base64 -d | tar xz
          else echo "ERROR: no project archive in repo root"; exit 1; fi
          grep -c "LoginGate" app/src/main/java/com/tmusic/app/Account.kt || true
          ls app/src/main/res/drawable-nodpi | grep tm_logo || echo "NO tm_logo"

      - name: Add Firebase config (optional secret GOOGLE_SERVICES_JSON)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }} -PghRepo=${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: TMusic-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: T Music build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
