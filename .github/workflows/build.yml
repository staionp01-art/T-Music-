          data class CoverPalette(val accent: Color, val bg: Color)

          /** لون الخلفية: نفس لون الغلاف الأكثر حضورًا لكن فاتحًا وزاهيًا، مع خفض السطوع فقط إن كان فاتحًا جدًا ليبقى النص مقروءًا. */
          private fun vividTone(h: Float, s: Float): Color {
              val sat = s.coerceIn(0.55f, 0.95f)
              var v = 0.82f
              var c = Color.hsv(h, sat, v)
              while (c.luminance() > 0.30f && v > 0.45f) { v -= 0.04f; c = Color.hsv(h, sat, v) }
              return c
          }

          /** اللون الأكثر حضورًا في الغلاف: نعدّ البكسلات الملوّنة حسب درجة اللون ونتجاهل الأسود والرمادي. */
          private fun dominantColor(b: Bitmap): Color? {
              val n = 48
              val small = Bitmap.createScaledBitmap(b, n, n, true)
              val px = IntArray(n * n)
              small.getPixels(px, 0, n, 0, 0, n, n)
              val w = FloatArray(36); val r = FloatArray(36); val g = FloatArray(36); val bl = FloatArray(36)
              val hsv = FloatArray(3)
              for (c in px) {
                  android.graphics.Color.colorToHSV(c, hsv)
                  if (hsv[2] < 0.2f || hsv[1] < 0.18f) continue
                  val wt = hsv[1] * hsv[2]
                  val i = (hsv[0] / 10f).toInt().coerceIn(0, 35)
                  w[i] += wt
                  r[i] += android.graphics.Color.red(c) * wt
                  g[i] += android.graphics.Color.green(c) * wt
                  bl[i] += android.graphics.Color.blue(c) * wt
              }
              var best = -1
              var bestScore = 0f
              for (i in 0 until 36) {
                  val sc = w[i] + 0.5f * (w[(i + 35) % 36] + w[(i + 1) % 36])
                  if (sc > bestScore) { bestScore = sc; best = i }
              }
              if (best < 0 || w[best] <= 0f) return null
              return Color(r[best] / w[best] / 255f, g[best] / w[best] / 255f, bl[best] / w[best] / 255f)
          }

          /** لون مميّز (فاتح) ولون خلفية من الغلاف، يتحركان بنعومة عند تغيّر الأغنية. */
          @Composable
          fun rememberCoverPalette(song: Song?, fallback: Color): CoverPalette {
              val art by rememberArt(song)
              val target by produceState(CoverPalette(TM.VioletSoft, fallback), art) {
                  val bmp = art
                  value = if (bmp == null) CoverPalette(TM.VioletSoft, fallback) else withContext(Dispatchers.Default) {
                      val base = dominantColor(bmp) ?: Palette.from(bmp).generate().let { p ->
                          (p.dominantSwatch ?: p.mutedSwatch)?.let { Color(it.rgb) }
                      }
                      if (base == null) CoverPalette(TM.VioletSoft, fallback) else {
                          val hsv = FloatArray(3)
                          android.graphics.Color.colorToHSV(base.toArgb(), hsv)
                          CoverPalette(
                              Color.hsv(hsv[0], hsv[1].coerceIn(0.45f, 0.85f), 0.95f),
                              vividTone(hsv[0], hsv[1])
                          )
                      }
                  }
              }
              val accent by animateColorAsState(target.accent, tween(900), label = "accent")
              val bg by animateColorAsState(target.bg, tween(900), label = "bg")
              return CoverPalette(accent, bg)
          }

          @Composable
          fun rememberCoverColor(song: Song?, fallback: Color): Color = rememberCoverPalette(song, fallback).bg

          @Composable
          fun Cover(song: Song?, modifier: Modifier = Modifier, corner: Dp = 12.dp, saturation: Float = 1f) {
              val art by rememberArt(song)
              val hue = abs(((song?.albumId ?: 0L) * 47) % 360).toFloat()
              Box(
                  modifier
                      .clip(RoundedCornerShape(corner))
                      .background(Brush.linearGradient(listOf(Color.hsv(hue, 0.5f, 0.45f), Color.hsv((hue + 40) % 360, 0.6f, 0.22f)))),
                  contentAlignment = Alignment.Center
              ) {
                  val b = art
                  if (b == null) Icon(Icons.Rounded.MusicNote, null, tint = Color.White.copy(0.5f), modifier = Modifier.fillMaxSize(0.4f))
                  else Image(
                      b.asImageBitmap(), null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop,
                      colorFilter = if (saturation < 0.999f) ColorFilter.colorMatrix(ColorMatrix().apply { setToSaturation(saturation) }) else null
                  )
              }
          }

