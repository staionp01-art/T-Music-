
name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Unpack project from this file
        run: |
          F=.github/workflows/build.yml
          if ! grep -q '^#TMEND$' "$F"; then
            echo "ERROR: build.yml is truncated - paste the whole file again (the last line must be #TMEND)"
            exit 1
          fi
          sed -n 's/^#TM //p' "$F" | base64 -d | tar xz
          ls -R app/src | head -40

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TMusic-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: T Music build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true

