name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Unpack project from tm.zip
        run: |
          if [ ! -f tm.zip ]; then
            echo "ERROR: tm.zip not found in the repository root - upload it next to the app folder"
            exit 1
          fi
          unzip -oq tm.zip
          ls -R app/src | head -40

      - name: Add Firebase config (optional secret GOOGLE_SERVICES_JSON)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }} -PghRepo=${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: TMusic-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: T Music build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
