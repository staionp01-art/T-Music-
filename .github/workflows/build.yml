name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Unpack project
        run: |
          test -f tm-project.tar.gz || { echo "ERROR: tm-project.tar.gz missing in repo root"; exit 1; }
          tar xzf tm-project.tar.gz
          ls -R app/src | head -40

      - name: Add Firebase config (optional secret GOOGLE_SERVICES_JSON)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi

      - name: Build debug APK (retries on network errors)
        run: |
          set -o pipefail
          for i in 1 2 3 4; do
            if gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }} -PghRepo=${{ github.repository }} 2>&1 | tee build.log; then
              exit 0
            fi
            if grep -q -e "429" -e "Could not resolve" -e "Could not GET" -e "Received status code 5" build.log; then
              echo "Network problem, retrying in 75s (attempt $i of 4)"
              sleep 75
            else
              exit 1
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: TMusic-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: T Music build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
