name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Unpack project (newest tm-project-vN.tar.gz wins)
        run: |
          ARCH=$(ls tm-project-v*.tar.gz 2>/dev/null | sort -V | tail -1)
          if [ -z "$ARCH" ]; then ARCH=tm-project.tar.gz; fi
          test -f "$ARCH" || { echo "ERROR: no tm-project archive in repo root"; exit 1; }
          echo "USING ARCHIVE: $ARCH"
          tar xzf "$ARCH"
          grep -c "hostActivity" app/src/main/java/com/tmusic/app/LiquidGlass.kt || true
          ls -R app/src | head -40

      - name: Apply compile hotfixes (safe to run on already-fixed code)
        run: |
          D=app/src/main/java/com/tmusic/app
          sed -i 's/fun Context\.findActivity()/fun Context.hostActivity()/' $D/LiquidGlass.kt
          sed -i 's/ctx\.findActivity()/ctx.hostActivity()/' $D/Settings.kt
          F=$D/LiquidGlass.kt
          sed -i '/^import androidx.compose.ui.graphics.drawscope.drawOutline$/d' $F
          grep -q '^import androidx.compose.ui.graphics.drawOutline$' $F || sed -i 's/^import androidx.compose.ui.graphics.drawscope.Stroke$/&\nimport androidx.compose.ui.graphics.drawOutline/' $F
          echo "hotfix check:"; grep -n "hostActivity\|drawOutline" $D/LiquidGlass.kt $D/Settings.kt

      - name: Add Firebase config (optional secret GOOGLE_SERVICES_JSON)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi

      - name: Build debug APK (retries on network errors)
        run: |
          set -o pipefail
          for i in 1 2 3 4; do
            if gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }} -PghRepo=${{ github.repository }} 2>&1 | tee build.log; then
              exit 0
            fi
            if grep -q -e "429" -e "Could not resolve" -e "Could not GET" -e "Received status code 5" build.log; then
              echo "Network problem, retrying in 75s (attempt $i of 4)"
              sleep 75
            else
              exit 1
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: TMusic-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: T Music build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
