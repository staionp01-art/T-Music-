          package com.tmusic.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Build
          import android.util.LruCache
          import android.util.Size
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          /** يحمّل أغلفة الألبومات بطريقة تعمل على كل إصدارات أندرويد، مع ذاكرة مؤقتة. */
          object Art {
              private val cache = object : LruCache<Long, Bitmap>(32 * 1024) {
                  override fun sizeOf(key: Long, value: Bitmap) = value.byteCount / 1024
              }
              private val missing = HashSet<Long>()
              private val remoteCache = object : LruCache<String, Bitmap>(16 * 1024) {
                  override fun sizeOf(key: String, value: Bitmap) = value.byteCount / 1024
              }

              /** صورة من رابط (مصغّرات يوتيوب مثلًا) مع ذاكرة مؤقتة. */
              suspend fun remote(url: String): Bitmap? {
                  remoteCache.get(url)?.let { return it }
                  val b = withContext(Dispatchers.IO) {
                      try {
                          val c = URL(url).openConnection() as HttpURLConnection
                          c.connectTimeout = 10000; c.readTimeout = 15000
                          try { c.inputStream.use { BitmapFactory.decodeStream(it) } } finally { c.disconnect() }
                      } catch (e: Exception) { null }
                  }
                  if (b != null) remoteCache.put(url, b)
                  return b
              }

              fun peek(albumId: Long): Bitmap? = cache.get(albumId)

              suspend fun get(ctx: Context, song: Song): Bitmap? {
                  cache.get(song.albumId)?.let { return it }
                  if (song.albumId in missing) return null
                  val bmp = withContext(Dispatchers.IO) {
                      try {
                          if (song.artUrl != null) {
                              val c = URL(song.artUrl).openConnection() as HttpURLConnection
                              c.connectTimeout = 10000; c.readTimeout = 15000
                              try { c.inputStream.use { BitmapFactory.decodeStream(it) } } finally { c.disconnect() }
                          }
                          else if (Build.VERSION.SDK_INT >= 29) ctx.contentResolver.loadThumbnail(song.uri, Size(480, 480), null)
                          else ctx.contentResolver.openInputStream(song.art)?.use { BitmapFactory.decodeStream(it) }
                      } catch (e: Exception) { null }
                  }
                  if (bmp != null) cache.put(song.albumId, bmp) else missing.add(song.albumId)
                  return bmp
              }
          }
