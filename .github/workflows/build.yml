          private fun SurahReader(n: Int, ui: PlayerUi, onBack: () -> Unit) {
              val ctx = LocalContext.current
              val info = Quran.surahs[n - 1]
              var lines by remember(n) { mutableStateOf<List<String>?>(null) }
              var failed by remember(n) { mutableStateOf(false) }
              var attempt by remember(n) { mutableIntStateOf(0) }
              LaunchedEffect(n, attempt) {
                  failed = false
                  val r = Quran.load(ctx, n)
                  lines = r
                  failed = r == null
              }
              BackHandler(onBack = onBack)

              val active = ui.quranSurah == n
              val listState = rememberLazyListState()
              val ls = lines
              LaunchedEffect(ui.quranAyah, active, ls != null) {
                  if (active && ls != null) listState.animateScrollToItem(ui.quranAyah.coerceAtLeast(0))
              }

              Column(Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth().padding(horizontal = 4.dp, vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onBack) { Icon(Icons.AutoMirrored.Rounded.ArrowBack, null) }
                      Column(Modifier.weight(1f)) {
                          Text("سورة ${info.name}", style = MaterialTheme.typography.titleLarge, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          Text("${Quran.digits(info.ayahs)} آية", fontSize = 12.sp, color = TM.Muted)
                      }
                      ReciterPicker(ui) { i ->
                          ui.setReciter(i)
                          if (active) ui.playQuran(n, ui.quranAyah.coerceAtLeast(1))
                      }
                  }

                  when {
                      ls != null -> LazyColumn(state = listState, contentPadding = PaddingValues(bottom = 24.dp), modifier = Modifier.fillMaxSize()) {
                          item {
                              Column(
                                  Modifier.fillMaxWidth().padding(16.dp).clip(RoundedCornerShape(22.dp))
                                      .background(Brush.linearGradient(listOf(Color(0xFF0F5C47), Color(0xFF123A4A))))
                                      .padding(20.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text("سورة ${info.name}", fontSize = 28.sp, fontWeight = FontWeight.ExtraBold, color = Color.White)
                                  if (Quran.hasBasmala(n)) {
                                      Spacer(Modifier.height(10.dp))
                                      Text(
                                          "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", fontSize = 24.sp, textAlign = TextAlign.Center,
                                          color = if (active && ui.quranAyah == 0) TM.Gold else Color.White.copy(0.9f)
                                      )
                                  }
                                  Spacer(Modifier.height(16.dp))
                                  Button(
                                      onClick = { if (active) ui.togglePlay() else ui.playQuran(n, 1) },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color.White, contentColor = Color.Black)
                                  ) {
                                      Icon(if (active && ui.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow, null, Modifier.size(22.dp))
                                      Spacer(Modifier.width(6.dp))
                                      Text(if (active && ui.isPlaying) "إيقاف مؤقت" else "استماع للسورة", fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                          itemsIndexed(ls) { i, text ->
                              val a = i + 1
                              val on = active && ui.quranAyah == a
                              val bg by animateColorAsState(if (on) TM.Emerald.copy(alpha = 0.16f) else Color.Transparent, tween(300), label = "ayah-bg")
                              Text(
                                  buildAnnotatedString {
                                      append(text)
                                      append(" ")
                                      withStyle(SpanStyle(color = TM.Gold, fontSize = 22.sp)) { append("﴿${Quran.digits(a)}﴾") }
                                  },
                                  fontSize = 28.sp, lineHeight = 52.sp, color = if (on) Color.White else TM.Text,
                                  modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 2.dp)
                                      .clip(RoundedCornerShape(14.dp)).background(bg)
                                      .clickable { ui.playQuran(n, a) }.padding(14.dp)
                              )
                          }
                      }
                      failed -> Column(
                          Modifier.fillMaxSize().padding(32.dp),
                          horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center
                      ) {
                          Icon(Icons.Rounded.CloudOff, null, Modifier.size(56.dp), tint = TM.Muted)
                          Spacer(Modifier.height(16.dp))
                          Text("تعذّر تحميل السورة", style = MaterialTheme.typography.titleMedium)
                          Spacer(Modifier.height(6.dp))
                          Text("تأكد من اتصالك بالإنترنت، وبعد التحميل الأول تُحفظ السورة على جهازك.", color = TM.Muted, textAlign = TextAlign.Center)
                          Spacer(Modifier.height(16.dp))
                          FilledTonalButton({ attempt++ }) { Text("إعادة المحاولة") }
                      }
                      else -> Box(Modifier.fillMaxSize(), Alignment.Center) { CircularProgressIndicator(color = TM.Emerald) }
                  }
              }
          }

