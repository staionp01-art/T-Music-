          /** بحث الأغاني على الإنترنت: Audius و Jamendo (أغانٍ كاملة). */
          data class YtVideo(val id: String, val title: String, val channel: String)

          object Online {
              /** مفتاح YouTube Data API v3 (مجاني من Google Cloud). بدونه لا تظهر نتائج يوتيوب. */
              const val YT_KEY = "PUT_KEY_HERE"
              /** رابط Cloudflare Worker (اختياري): يخفي المفتاح ويخزّن النتائج فيشترك الأصدقاء في الحصة. */
              const val YT_PROXY = ""
              val ytReady: Boolean get() = true   // بدون مفتاح يعمل البحث المجاني المباشر
              private val keySet: Boolean get() = YT_KEY.isNotBlank() && YT_KEY != "PUT_KEY_HERE"
              private val ytCache = HashMap<String, List<YtVideo>>()
              private fun clean(t: String) = android.text.Html.fromHtml(t, android.text.Html.FROM_HTML_MODE_LEGACY).toString()

              /** معرّف سالب ثابت لكل أغنية إنترنت حتى لا يتعارض مع معرّفات أغاني الجهاز. */
              private fun rid(key: String): Long = -((key.hashCode().toLong() and 0x7fffffffL) + 1)

              private fun get(url: String): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 10000
                  c.readTimeout = 15000
                  c.setRequestProperty("Accept", "application/json")
                  return try {
                      c.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                  } finally {
                      c.disconnect()
                  }
              }

              suspend fun search(q: String): List<Song> = coroutineScope {
                  val a = async(Dispatchers.IO) { runCatching { audius(q) }.getOrDefault(emptyList()) }
                  val b = async(Dispatchers.IO) { runCatching { jamendo(q) }.getOrDefault(emptyList()) }
                  a.await() + b.await()
              }

              /** بحث يوتيوب الرسمي (فيديوهات الموسيقى القابلة للتضمين فقط). */
              suspend fun youtube(q: String): List<YtVideo> = withContext(Dispatchers.IO) {
                  val key = q.trim().lowercase()
                  ytCache[key]?.let { return@withContext it }
                  val e = URLEncoder.encode(q, "UTF-8")
                  var out: List<YtVideo> = emptyList()
                  // 1) Worker الخاص بك (اختياري)  2) مفتاح رسمي (اختياري)  3) البحث المجاني المباشر بلا مفتاح ولا حصة
                  if (YT_PROXY.isNotBlank()) out = runCatching {
                      val arr = JSONArray(get("$YT_PROXY?q=$e"))
                      (0 until arr.length()).map { i ->
                          val o = arr.getJSONObject(i)
                          YtVideo(o.getString("id"), clean(o.optString("title")), o.optString("channel"))
                      }
                  }.getOrDefault(emptyList())
                  if (out.isEmpty() && keySet) out = runCatching {
                      val arr = JSONObject(
                          get("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=15&q=$e&key=$YT_KEY")
                      ).getJSONArray("items")
                      (0 until arr.length()).map { i ->
                          val o = arr.getJSONObject(i)
                          val sn = o.getJSONObject("snippet")
                          YtVideo(o.getJSONObject("id").getString("videoId"), clean(sn.optString("title")), sn.optString("channelTitle"))
                      }
                  }.getOrDefault(emptyList())
                  if (out.isEmpty()) out = runCatching { innertube(q) }.getOrDefault(emptyList())
                  if (out.isNotEmpty()) ytCache[key] = out
                  out
              }

