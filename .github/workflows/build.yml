name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Unpack project
        run: |
          if ls tm-part-*.txt >/dev/null 2>&1; then cat tm-part-*.txt | base64 -d | tar xz
          elif [ -f tm-project.b64.txt ]; then base64 -d tm-project.b64.txt | tar xz
          elif [ -f tm-project.zip ]; then unzip -oq tm-project.zip
          elif [ -f tm-project.tar.gz ]; then tar xzf tm-project.tar.gz
          else echo "ERROR: no project archive in repo root"; exit 1; fi
          ls -R app/src | head -40

      - name: Add Firebase config (optional secret GOOGLE_SERVICES_JSON)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }} -PghRepo=${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: TMusic-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: T Music build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
