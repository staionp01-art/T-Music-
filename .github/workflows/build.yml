name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # لازم لمعرفة أحدث ملف zip مرفوع

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Unpack newest zip in the repository root
        run: |
          # يختار أحدث ملف zip تم رفعه (حسب آخر commit له)، مهما كان اسمه
          newest=""; newest_t=0
          for z in ./*.zip; do
            [ -f "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z")
            [ -z "$t" ] && continue
            if [ "$t" -gt "$newest_t" ]; then newest_t=$t; newest="$z"; fi
          done
          if [ -z "$newest" ]; then
            echo "ERROR: no zip file found in the repository root"
            exit 1
          fi
          echo "Using: $newest (committed $(date -d @$newest_t))"
          unzip -oq "$newest"
          ls -R app/src | head -40

      - name: Add Firebase config (optional secret GOOGLE_SERVICES_JSON)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi

      - name: Build debug APK (retries if Maven is rate-limiting)
        run: |
          for i in 1 2 3; do
            gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }} -PghRepo=${{ github.repository }} && break
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "Attempt $i failed, retrying in 90s..."
            sleep 90
          done

      - uses: actions/upload-artifact@v4
        with:
          name: TMusic-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: T Music build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
