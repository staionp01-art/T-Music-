          fun EqBars(playing: Boolean, color: Color) {
              val t = rememberInfiniteTransition(label = "eq")
              Row(Modifier.height(16.dp), horizontalArrangement = Arrangement.spacedBy(2.dp), verticalAlignment = Alignment.Bottom) {
                  listOf(420, 560, 360).forEachIndexed { i, d ->
                      val h by t.animateFloat(0.25f, 1f, infiniteRepeatable(tween(d, easing = LinearEasing), RepeatMode.Reverse), label = "bar$i")
                      Box(Modifier.width(3.dp).fillMaxHeight(if (playing) h else 0.3f).background(color, RoundedCornerShape(2.dp)))
                  }
              }
          }

