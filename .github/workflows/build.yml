          /**
           * خلفية سينمائية: لون الغلاف الأكثر حضورًا فاتحًا، وغلاف مموّه يتحرك ببطء (Ken Burns) ويتبدّل بتلاشٍ،
           * وتوهّجان يخفقان بإيقاع منتظم أثناء التشغيل ويخفتان عند الإيقاف، وإطار معتم أعلى وأسفل.
           */
          @Composable
          private fun CinematicBackdrop(song: Song, pal: CoverPalette, playing: Boolean) {
              val inf = rememberInfiniteTransition(label = "backdrop")
              val drift by inf.animateFloat(0f, 1f, infiniteRepeatable(tween(16000, easing = LinearEasing), RepeatMode.Reverse), label = "drift")
              val pulse by inf.animateFloat(0f, 1f, infiniteRepeatable(tween(1300, easing = FastOutSlowInEasing), RepeatMode.Reverse), label = "pulse")
              val live by animateFloatAsState(if (playing) 1f else 0.3f, tween(900), label = "live")
              Box(Modifier.fillMaxSize()) {
                  Box(
                      Modifier.fillMaxSize().background(
                          Brush.verticalGradient(0f to pal.bg, 0.5f to lerp(pal.bg, TM.Ink, 0.6f), 0.9f to TM.Ink)
                      )
                  )
                  if (Build.VERSION.SDK_INT >= 31) {
                      Crossfade(song, animationSpec = tween(900), label = "backdrop-art") { sg ->
                          val art by rememberArt(sg)
                          val b = art
                          if (b != null) Image(
                              b.asImageBitmap(), null,
                              Modifier.fillMaxSize().graphicsLayer {
                                  val z = 1.5f + 0.15f * drift
                                  scaleX = z; scaleY = z
                                  translationX = (drift - 0.5f) * 90f
                                  alpha = 0.5f * (0.5f + 0.5f * live)
                              }.blur(70.dp),
                              contentScale = ContentScale.Crop
                          )
                      }
                  }
                  Box(
                      Modifier.fillMaxSize().drawBehind {
                          val k = 1f + 0.12f * pulse * live
                          drawRect(
                              Brush.radialGradient(
                                  listOf(pal.accent.copy(alpha = 0.34f * live), Color.Transparent),
                                  center = Offset(size.width * (0.2f + 0.6f * drift), size.height * 0.30f), radius = size.width * 0.9f * k
                              )
                          )
                          drawRect(
                              Brush.radialGradient(
                                  listOf(pal.accent.copy(alpha = 0.2f * live), Color.Transparent),
                                  center = Offset(size.width * (0.9f - 0.6f * drift), size.height * 0.62f), radius = size.width * 0.8f * k
                              )
                          )
                          drawRect(Brush.verticalGradient(0f to Color.Black.copy(0.35f), 0.2f to Color.Transparent, 0.8f to Color.Transparent, 1f to Color.Black.copy(0.45f)))
                      }
                  )
              }
          }

          /** دخول متدرّج: كل عنصر يظهر بتأخير بسيط ويصعد من الأسفل. */
          @Composable
          private fun Modifier.stagger(index: Int): Modifier {
              val a = remember { Animatable(0f) }
              LaunchedEffect(Unit) {
                  delay(110L * index)
                  a.animateTo(1f, tween(600, easing = FastOutSlowInEasing))
              }
              return this.graphicsLayer { alpha = a.value; translationY = (1f - a.value) * 60f }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun NowPlaying(song: Song, ui: PlayerUi, onClose: () -> Unit) {
              val ctx = LocalContext.current
              val pal = rememberCoverPalette(song, TM.Raised)
              var showLyrics by remember { mutableStateOf(false) }
              var version by remember { mutableIntStateOf(0) }
              val lyrics = remember(song.id, version) { LyricsStore.load(ctx, song.id) }
              var showPaste by remember { mutableStateOf(false) }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                  val text = uri?.let {
                      runCatching { ctx.contentResolver.openInputStream(it)?.bufferedReader(Charsets.UTF_8)?.use { r -> r.readText() } }.getOrNull()
                  }
                  if (!text.isNullOrBlank()) { LyricsStore.save(ctx, song.id, text); version++ }
              }

              // مدخل سينمائي: شريطان أسودان ينسحبان عند فتح الشاشة
              val open = remember { Animatable(0f) }
              LaunchedEffect(Unit) { open.animateTo(1f, tween(900, easing = FastOutSlowInEasing)) }

              // وميض سينمائي سريع عند تبديل الأغنية (تالي/سابق)
              val skipFlash = remember { Animatable(0f) }
              var firstSong by remember { mutableStateOf(true) }
              LaunchedEffect(song.id) {
                  if (firstSong) { firstSong = false; return@LaunchedEffect }
                  skipFlash.snapTo(0.22f)
                  skipFlash.animateTo(0f, tween(600, easing = FastOutSlowInEasing))
              }
              // شريطان سينمائيان يطبقان قليلًا عند الإيقاف مؤقتًا
              val pauseBar by animateDpAsState(if (ui.isPlaying) 0.dp else 26.dp, tween(650, easing = FastOutSlowInEasing), label = "pause-bars")

              Box(Modifier.fillMaxSize().background(TM.Ink).clickable(enabled = false) {}) {
                  CinematicBackdrop(song, pal, ui.isPlaying)

                  Column(Modifier.fillMaxSize().systemBarsPadding().padding(horizontal = 24.dp)) {
                      // الشريط العلوي
                      Row(Modifier.fillMaxWidth().padding(vertical = 4.dp).stagger(0), verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClose) { Icon(Icons.Rounded.KeyboardArrowDown, null, Modifier.size(32.dp)) }
                          Column(Modifier.weight(1f), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("يُشغَّل الآن", fontSize = 12.sp, color = Color.White.copy(0.65f))
                              Text(
                                  song.album.ifBlank { song.artist }, fontSize = 14.sp, fontWeight = FontWeight.SemiBold,
                                  maxLines = 1, overflow = TextOverflow.Ellipsis
                              )
                          }
                          if (song.downloadUrl != null) IconButton({ downloadSong(ctx, song) }) {
                              Icon(Icons.Rounded.Download, null, Modifier.size(26.dp))
                          }
                          IconButton({ showLyrics = !showLyrics }) {
                              Icon(Icons.Rounded.Lyrics, null, tint = if (showLyrics) pal.accent else Color.White, modifier = Modifier.size(26.dp))
                          }
                      }

                      // المنطقة الوسطى: الغلاف أو الكلمات
                      Box(Modifier.weight(1f).fillMaxWidth().stagger(1), contentAlignment = Alignment.Center) {
                          Crossfade(showLyrics, label = "stage") { lyricsOn ->
                              if (lyricsOn) LyricsPanel(
                                  lyrics, ui,
                                  onPick = { picker.launch(arrayOf("*/*")) },
                                  onPaste = { showPaste = true },
                                  onClear = { LyricsStore.delete(ctx, song.id); version++ }
                              ) else CoverStage(song, ui, pal.accent)
                          }
                      }

                      // العنوان: ينتقل بنعومة عند تغيّر الأغنية
                      AnimatedContent(
                          targetState = song,
                          modifier = Modifier.fillMaxWidth().padding(top = 12.dp).stagger(2),
                          transitionSpec = {
                              (fadeIn(tween(450, delayMillis = 120)) + slideInVertically(tween(450)) { it / 3 }) togetherWith
                                  fadeOut(tween(200))
                          },
                          label = "titles"
                      ) { sg ->
                          Column(Modifier.fillMaxWidth()) {
                              Text(sg.title, fontSize = 24.sp, fontWeight = FontWeight.ExtraBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Text(sg.artist, fontSize = 16.sp, color = Color.White.copy(0.7f), maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                      }

                      // شريط التقدّم + الأزرار (دائمًا من اليسار لليمين)
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                          Column(Modifier.fillMaxWidth().padding(top = 8.dp, bottom = 16.dp).stagger(3)) {
                              var drag by remember { mutableStateOf<Float?>(null) }
                              val dur = ui.duration.coerceAtLeast(1L).toFloat()
                              val shown = (drag ?: ui.position.toFloat()).coerceIn(0f, dur)
                              Slider(
                                  value = shown, valueRange = 0f..dur,
                                  onValueChange = { drag = it },
                                  onValueChangeFinished = { drag?.let { ui.seek(it.toLong()) }; drag = null },
                                  thumb = { Box(Modifier.size(14.dp).background(Color.White, CircleShape)) },
                                  colors = SliderDefaults.colors(
                                      activeTrackColor = pal.accent, inactiveTrackColor = Color.White.copy(0.22f)
                                  )
                              )
                              Row(Modifier.fillMaxWidth().padding(horizontal = 4.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text(fmt(shown.toLong()), fontSize = 12.sp, color = Color.White.copy(0.65f))
                                  Text(fmt(ui.duration), fontSize = 12.sp, color = Color.White.copy(0.65f))
                              }
                              Spacer(Modifier.height(8.dp))
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  IconButton(ui::toggleShuffle) {
                                      Icon(Icons.Rounded.Shuffle, null, tint = if (ui.shuffle) pal.accent else Color.White.copy(0.7f))
                                  }
                                  IconButton(ui::previous, Modifier.size(56.dp)) { Icon(Icons.Rounded.SkipPrevious, null, Modifier.size(40.dp)) }
                                  FilledIconButton(
                                      ui::togglePlay, Modifier.size(72.dp),
                                      colors = IconButtonDefaults.filledIconButtonColors(containerColor = Color.White, contentColor = Color.Black)
                                  ) {
                                      Icon(if (ui.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow, null, Modifier.size(42.dp))
                                  }
                                  IconButton(ui::next, Modifier.size(56.dp)) { Icon(Icons.Rounded.SkipNext, null, Modifier.size(40.dp)) }
                                  IconButton(ui::cycleRepeat) {
                                      Icon(
                                          if (ui.repeat == Player.REPEAT_MODE_ONE) Icons.Rounded.RepeatOne else Icons.Rounded.Repeat, null,
                                          tint = if (ui.repeat != Player.REPEAT_MODE_OFF) pal.accent else Color.White.copy(0.7f)
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // الشريطان السينمائيان (يغطيان الأعلى والأسفل ثم ينسحبان)
                  val bar = maxOf((110f * (1f - open.value)).dp, pauseBar)
                  Box(Modifier.align(Alignment.TopCenter).fillMaxWidth().height(bar).background(Color.Black))
                  Box(Modifier.align(Alignment.BottomCenter).fillMaxWidth().height(bar).background(Color.Black))
                  if (skipFlash.value > 0.002f) Box(Modifier.fillMaxSize().background(Color.White.copy(alpha = skipFlash.value)))
              }

              if (showPaste) {
                  var text by remember { mutableStateOf("") }
                  AlertDialog(
                      onDismissRequest = { showPaste = false },
                      title = { Text("لصق الكلمات") },
                      text = {
                          OutlinedTextField(
                              text, { text = it }, minLines = 6, maxLines = 10,
                              placeholder = { Text("الصق الكلمات هنا. يدعم تنسيق LRC المتزامن.") }
                          )
                      },
                      confirmButton = {
                          TextButton({
                              if (text.isNotBlank()) { LyricsStore.save(ctx, song.id, text); version++ }
                              showPaste = false
                          }) { Text("حفظ") }
                      },
                      dismissButton = { TextButton({ showPaste = false }) { Text("إلغاء") } }
                  )
              }
          }

          /**
           * الغلاف السينمائي:
           *  - الانتقال بين الأغاني: ينزلق الغلاف القديم ويصغر، ويدخل الجديد من الجهة المناسبة (التالي/السابق).
           *  - الإيقاف: يصغر الغلاف ويخفت لونه ويظلم، وتظهر أيقونة إيقاف تتلاشى.
           *  - التشغيل: يعود بنبضة مرنة، تظهر أيقونة تشغيل وحلقة ضوء تتسع وتتلاشى.
           *  - أثناء التشغيل: تقريب بطيء للصورة (Ken Burns) ولمعة ضوء تعبر الغلاف.
           */
          @Composable
          private fun CoverStage(song: Song, ui: PlayerUi, accent: Color) {
              val playing = ui.isPlaying
              val scale by animateFloatAsState(if (playing) 1f else 0.84f, spring(dampingRatio = 0.55f, stiffness = 220f), label = "cover-scale")
              val sat by animateFloatAsState(if (playing) 1f else 0.25f, tween(700), label = "cover-sat")
              val dim by animateFloatAsState(if (playing) 0f else 0.35f, tween(700), label = "cover-dim")
              val inf = rememberInfiniteTransition(label = "cover-fx")
              val zoom by inf.animateFloat(1f, 1.07f, infiniteRepeatable(tween(18000, easing = LinearEasing), RepeatMode.Reverse), label = "zoom")
              val sweep by inf.animateFloat(-0.6f, 1.6f, infiniteRepeatable(tween(5200, easing = FastOutSlowInEasing), RepeatMode.Restart), label = "sweep")

              val flash = remember { Animatable(1f) }
              val ring = remember { Animatable(1f) }
              var first by remember { mutableStateOf(true) }
              LaunchedEffect(playing) {
                  if (first) { first = false; return@LaunchedEffect }
                  flash.snapTo(0f); ring.snapTo(0f)
                  if (playing) launch { ring.animateTo(1f, tween(900)) }
                  flash.animateTo(1f, tween(650, easing = FastOutSlowInEasing))
              }

              BoxWithConstraints(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                  val s = minOf(maxWidth, maxHeight)

                  Canvas(Modifier.size(s)) {
                      val p = ring.value
                      if (p in 0.01f..0.99f) {
                          drawCircle(
                              accent.copy(alpha = 0.5f * (1f - p)),
                              radius = size.minDimension / 2f * (0.9f + 0.6f * p),
                              style = Stroke(width = 6f)
                          )
                      }
                  }

                  AnimatedContent(
                      targetState = song,
                      transitionSpec = {
                          val d = ui.dir
                          (slideInHorizontally(tween(550, easing = FastOutSlowInEasing)) { d * it / 2 } +
                              fadeIn(tween(450)) + scaleIn(tween(550), initialScale = 0.85f)) togetherWith
                              (slideOutHorizontally(tween(450, easing = FastOutSlowInEasing)) { -d * it / 2 } +
                                  fadeOut(tween(300)) + scaleOut(tween(450), targetScale = 0.85f))
                      },
                      label = "cover-swap"
                  ) { sg ->
                      Box(
                          Modifier.size(s)
                              .graphicsLayer { scaleX = scale; scaleY = scale }
                              .shadow(30.dp, RoundedCornerShape(22.dp), clip = false, ambientColor = accent, spotColor = accent)
                              .clip(RoundedCornerShape(22.dp))
                              .drawWithContent {
                                  drawContent()
                                  // تعتيم الإيقاف + إطار معتم خفيف (Vignette)
                                  drawRect(Color.Black.copy(alpha = dim))
                                  drawRect(
                                      Brush.radialGradient(
                                          0.6f to Color.Transparent, 1f to Color.Black.copy(alpha = 0.35f),
                                          center = center, radius = size.maxDimension * 0.75f
                                      )
                                  )
                                  // لمعة ضوء تعبر الغلاف أثناء التشغيل
                                  if (playing) {
                                      val x = size.width * sweep
                                      drawRect(
                                          Brush.linearGradient(
                                              listOf(Color.Transparent, Color.White.copy(alpha = 0.16f), Color.Transparent),
                                              start = Offset(x - 140f, 0f), end = Offset(x + 140f, size.height)
                                          )
                                      )
                                  }
                              }
                      ) {
                          Cover(sg, Modifier.fillMaxSize().graphicsLayer { scaleX = zoom; scaleY = zoom }, corner = 0.dp, saturation = sat)
                      }
                  }

                  // أيقونة تشغيل/إيقاف تظهر وتتلاشى عند الضغط
                  if (flash.value in 0.001f..0.999f) {
                      Box(
                          Modifier.size(96.dp)
                              .graphicsLayer {
                                  alpha = 1f - flash.value
                                  scaleX = 0.7f + 0.6f * flash.value
                                  scaleY = 0.7f + 0.6f * flash.value
                              }
                              .background(Color.Black.copy(alpha = 0.45f), CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(if (playing) Icons.Rounded.PlayArrow else Icons.Rounded.Pause, null, Modifier.size(54.dp), tint = Color.White)
                      }
                  }
              }
          }

          @Composable
          private fun LyricsPanel(
              lyrics: Lyrics?, ui: PlayerUi,
              onPick: () -> Unit, onPaste: () -> Unit, onClear: () -> Unit
          ) {
              if (lyrics == null) {
                  Column(Modifier.fillMaxSize(), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                      Icon(Icons.Rounded.Lyrics, null, Modifier.size(52.dp), tint = Color.White.copy(0.5f))
                      Spacer(Modifier.height(14.dp))
                      Text("لا توجد كلمات لهذه الأغنية", fontWeight = FontWeight.SemiBold, fontSize = 18.sp)
                      Spacer(Modifier.height(6.dp))
                      Text(
                          "أضف ملف .lrc لتظهر الكلمات متزامنة مع الصوت، أو الصق النص.",
                          color = Color.White.copy(0.65f), textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(20.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          FilledTonalButton(onPick) {
                              Icon(Icons.Rounded.UploadFile, null, Modifier.size(18.dp)); Spacer(Modifier.width(6.dp)); Text("اختيار ملف")
                          }
                          OutlinedButton(onPaste) {
                              Icon(Icons.Rounded.ContentPaste, null, Modifier.size(18.dp)); Spacer(Modifier.width(6.dp)); Text("لصق نص")
                          }
                      }
                  }
                  return
              }

              val listState = rememberLazyListState()
              val active by remember(lyrics) {
                  derivedStateOf { if (lyrics.synced) lyrics.lines.indexOfLast { it.timeMs <= ui.position + 250 } else -1 }
              }
              LaunchedEffect(active) {
                  if (active >= 0) listState.animateScrollToItem(active, -listState.layoutInfo.viewportSize.height / 3)
              }

              LazyColumn(
                  state = listState,
                  contentPadding = PaddingValues(vertical = 90.dp),
                  modifier = Modifier.fillMaxSize()
                      .graphicsLayer { compositingStrategy = CompositingStrategy.Offscreen }
                      .drawWithContent {
                          drawContent()
                          drawRect(
                              Brush.verticalGradient(0f to Color.Transparent, 0.12f to Color.Black, 0.88f to Color.Black, 1f to Color.Transparent),
                              blendMode = BlendMode.DstIn
                          )
                      }
              ) {
                  itemsIndexed(lyrics.lines) { i, line ->
                      val on = lyrics.synced && i == active
                      val color by animateColorAsState(
                          when { !lyrics.synced -> Color.White.copy(0.9f); on -> Color.White; else -> Color.White.copy(0.32f) },
                          tween(300), label = "lyric-color"
                      )
                      val size by animateFloatAsState(if (on) 28f else 24f, tween(300), label = "lyric-size")
                      Text(
                          line.text, color = color, fontSize = size.sp, lineHeight = (size * 1.3f).sp, fontWeight = FontWeight.Bold,
                          modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp))
                              .then(if (lyrics.synced) Modifier.clickable { ui.seek(line.timeMs) } else Modifier)
                              .padding(horizontal = 4.dp, vertical = 9.dp)
                      )
                  }
                  item {
                      TextButton(onClear, Modifier.padding(top = 24.dp)) {
                          Icon(Icons.Rounded.Delete, null, Modifier.size(18.dp)); Spacer(Modifier.width(6.dp)); Text("حذف الكلمات")
                      }
                  }
              }
          }
          TMEOF
          mkdir -p app/src/main/java/com/tmusic/app
          cat > app/src/main/java/com/tmusic/app/Quran.kt <<'TMEOF'
          package com.tmusic.app

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          data class SurahInfo(val number: Int, val name: String, val ayahs: Int)
          data class Reciter(val name: String, val folder: String)

          /** بيانات القرآن: أسماء السور وأعداد الآيات، القرّاء، وتحميل النص مع تخزين محلي. */
          object Quran {
              private val names = listOf(
                  "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
                  "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
                  "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
                  "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
                  "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
                  "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
                  "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
                  "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
                  "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
                  "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
                  "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",
                  "المسد", "الإخلاص", "الفلق", "الناس"
              )

              private val counts = intArrayOf(
                  7, 286, 200, 176, 120, 165, 206, 75, 129, 109,
                  123, 111, 43, 52, 99, 128, 111, 110, 98, 135,
                  112, 78, 118, 64, 77, 227, 93, 88, 69, 60,
                  34, 30, 73, 54, 45, 83, 182, 88, 75, 85,
                  54, 53, 89, 59, 37, 35, 38, 29, 18, 45,
                  60, 49, 62, 55, 78, 96, 29, 22, 24, 13,
                  14, 11, 11, 18, 12, 12, 30, 52, 52, 44,
                  28, 28, 20, 56, 40, 31, 50, 40, 46, 42,
                  29, 19, 36, 25, 22, 17, 19, 26, 30, 20,
                  15, 21, 11, 8, 8, 19, 5, 8, 8, 11,
                  11, 8, 3, 9, 5, 4, 7, 3, 6, 3,
                  5, 4, 5, 6
              )

              val surahs: List<SurahInfo> = names.indices.map { SurahInfo(it + 1, names[it], counts[it]) }

              val reciters = listOf(
                  Reciter("مشاري العفاسي", "Alafasy_128kbps"),
                  Reciter("عبد الرحمن السديس", "Abdurrahmaan_As-Sudais_192kbps"),
                  Reciter("سعود الشريم", "Saood_ash-Shuraym_128kbps"),
                  Reciter("محمود الحصري", "Husary_128kbps"),
                  Reciter("عبد الباسط عبد الصمد", "Abdul_Basit_Murattal_192kbps"),
                  Reciter("محمد صديق المنشاوي", "Minshawy_Murattal_128kbps")
              )

              /** كل السور تبدأ بالبسملة عدا الفاتحة (هي آية فيها) والتوبة (بلا بسملة). */
              fun hasBasmala(surah: Int) = surah != 1 && surah != 9

              fun audioUrl(folder: String, surah: Int, ayah: Int): String =
                  String.format(Locale.US, "https://everyayah.com/data/%s/%03d%03d.mp3", folder, surah, ayah)

              fun digits(n: Int): String = n.toString().map { '٠' + (it - '0') }.joinToString("")

              fun normalize(s: String): String = s.trim()
                  .replace('أ', 'ا').replace('إ', 'ا').replace('آ', 'ا')
                  .replace('ة', 'ه').replace('ى', 'ي')

              fun search(q: String): List<SurahInfo> {
                  val k = normalize(q).removePrefix("سورة").trim()
                  if (k.isEmpty()) return emptyList()
                  return surahs.filter { normalize(it.name).contains(k) || it.number.toString() == k }
              }

              /** يحمّل آيات السورة؛ من الذاكرة المحلية إن وُجدت وإلا من الإنترنت ثم يحفظها. */
              suspend fun load(ctx: Context, surah: Int): List<String>? = withContext(Dispatchers.IO) {
                  val expected = counts[surah - 1]
                  val f = File(File(ctx.filesDir, "quran").apply { mkdirs() }, "$surah.txt")
                  if (f.exists()) {
                      val cached = f.readLines()
                      if (cached.size == expected) return@withContext cached
                  }
                  try {
                      val conn = URL("https://api.alquran.cloud/v1/surah/$surah/quran-uthmani").openConnection() as HttpURLConnection
                      conn.connectTimeout = 15000
                      conn.readTimeout = 20000
                      val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                      conn.disconnect()
                      val arr = JSONObject(body).getJSONObject("data").getJSONArray("ayahs")
                      val out = (0 until arr.length()).map { i ->
                          val t = arr.getJSONObject(i).getString("text").replace("\n", " ").trim()
                          if (i == 0 && hasBasmala(surah)) stripBasmala(t) else t
                      }
                      if (out.size == expected) { f.writeText(out.joinToString("\n")); out } else null
                  } catch (e: Exception) {
                      null
                  }
              }

              /** النص العثماني يضع البسملة في أول آية؛ نفصلها لنعرضها في الترويسة. */
              private fun stripBasmala(t: String): String {
                  val words = t.split(" ")
                  if (words.size <= 4) return t
                  val first = words[0].filter { Character.getType(it) != Character.NON_SPACING_MARK.toInt() }
                  return if (first == "بسم") words.drop(4).joinToString(" ") else t
              }
          }
