          package com.tmusic.app

          import androidx.media3.common.AudioAttributes
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlaybackService : MediaSessionService() {
              private var session: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val player = ExoPlayer.Builder(this)
                      .setAudioAttributes(AudioAttributes.DEFAULT, true)
                      .setHandleAudioBecomingNoisy(true)
                      .build()
                  session = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo) = session

              override fun onDestroy() {
                  session?.run { player.release(); release() }
                  session = null
                  super.onDestroy()
              }
          }
          TMEOF
          mkdir -p app/src/main/java/com/tmusic/app
          cat > app/src/main/java/com/tmusic/app/PlayerUi.kt <<'TMEOF'
          package com.tmusic.app

          import android.content.ComponentName
          import android.content.Context
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalContext
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken

          @Stable
          class PlayerUi(ctx: Context) {
              private val prefs = ctx.getSharedPreferences("tm", Context.MODE_PRIVATE)

              var controller by mutableStateOf<MediaController?>(null)
                  private set
              var currentId by mutableLongStateOf(-1L)
              var isPlaying by mutableStateOf(false)
              var position by mutableLongStateOf(0L)
              var duration by mutableLongStateOf(0L)
              var shuffle by mutableStateOf(false)
              var repeat by mutableIntStateOf(Player.REPEAT_MODE_OFF)
              var recents by mutableStateOf(readRecents())

              /** أغاني الإنترنت التي شُغّلت، لنجد الأغنية الحالية بمعرّفها. */
              val online = HashMap<Long, Song>()

              /** اتجاه آخر تغيير للأغنية: 1 = التالي، -1 = السابق (يستعمله تأثير الانتقال). */
              var dir by mutableIntStateOf(1)
                  private set

              // قسم القرآن: السورة والآية الجاري تشغيلهما (0 = لا شيء / البسملة)
              var quranSurah by mutableIntStateOf(0)
                  private set
              var quranAyah by mutableIntStateOf(0)
                  private set
              var reciterIdx by mutableIntStateOf(prefs.getInt("reciter", 0).coerceIn(0, Quran.reciters.lastIndex))
                  private set

              fun setReciter(i: Int) {
                  reciterIdx = i.coerceIn(0, Quran.reciters.lastIndex)
                  prefs.edit().putInt("reciter", reciterIdx).apply()
              }

              private fun readRecents(): List<Long> =
                  (prefs.getString("recent", "") ?: "").split(",").mapNotNull { it.toLongOrNull() }

              private fun pushRecent(id: Long) {
                  recents = (listOf(id) + recents.filter { it != id }).take(12)
                  prefs.edit().putString("recent", recents.joinToString(",")).apply()
              }

              /** معرّف القرآن بصيغة q:السورة:الآية، وأي معرّف آخر فهو أغنية. */
              private fun onItem(mediaId: String?, record: Boolean) {
                  if (mediaId == null) return
                  if (mediaId.startsWith("q:")) {
                      val p = mediaId.split(":")
                      quranSurah = p.getOrNull(1)?.toIntOrNull() ?: 0
                      quranAyah = p.getOrNull(2)?.toIntOrNull() ?: 0
                      currentId = -1L
                  } else {
                      quranSurah = 0; quranAyah = 0
                      mediaId.toLongOrNull()?.let { currentId = it; if (record) pushRecent(it) }
                  }
              }

              private val listener = object : Player.Listener {
                  override fun onIsPlayingChanged(isPlaying: Boolean) { this@PlayerUi.isPlaying = isPlaying }
                  override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                      if (reason == Player.MEDIA_ITEM_TRANSITION_REASON_AUTO || reason == Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED) dir = 1
                      onItem(mediaItem?.mediaId, record = true)
                      syncPosition()
                  }
                  override fun onPlaybackStateChanged(playbackState: Int) = syncPosition()
                  override fun onShuffleModeEnabledChanged(shuffleModeEnabled: Boolean) { shuffle = shuffleModeEnabled }
                  override fun onRepeatModeChanged(repeatMode: Int) { repeat = repeatMode }
              }

              fun attach(c: MediaController) {
                  controller = c
                  c.addListener(listener)
                  isPlaying = c.isPlaying
                  shuffle = c.shuffleModeEnabled
                  repeat = c.repeatMode
                  onItem(c.currentMediaItem?.mediaId, record = false)
                  syncPosition()
              }

              fun detach() {
                  controller?.removeListener(listener)
                  controller = null
              }

              fun syncPosition() {
                  controller?.let { position = it.currentPosition; duration = it.duration.coerceAtLeast(0L) }
              }

              private fun item(s: Song) = MediaItem.Builder()
                  .setUri(s.uri).setMediaId(s.id.toString())
                  .setMediaMetadata(MediaMetadata.Builder().setTitle(s.title).setArtist(s.artist).setArtworkUri(s.art).build())
                  .build()

              fun play(list: List<Song>, index: Int, shuffleMode: Boolean? = null) {
                  val c = controller ?: return
                  if (list.isEmpty()) return
                  list.forEach { if (it.remoteUrl != null) online[it.id] = it }
                  if (shuffleMode != null) c.shuffleModeEnabled = shuffleMode
                  c.setMediaItems(list.map(::item), index.coerceIn(list.indices), 0)
                  c.prepare(); c.play()
              }

              /** يشغّل السورة آية بعد آية (مع البسملة في البداية) بصوت القارئ المختار. */
              fun playQuran(surah: Int, startAyah: Int = 1) {
                  val c = controller ?: return
                  val info = Quran.surahs.getOrNull(surah - 1) ?: return
                  val reciter = Quran.reciters[reciterIdx]
                  fun q(s: Int, a: Int, urlSurah: Int, urlAyah: Int, label: String) = MediaItem.Builder()
                      .setUri(Quran.audioUrl(reciter.folder, urlSurah, urlAyah))
                      .setMediaId("q:$s:$a")
                      .setMediaMetadata(MediaMetadata.Builder().setTitle("سورة ${info.name} - $label").setArtist(reciter.name).build())
                      .build()
                  val bism = Quran.hasBasmala(surah)
                  val items = buildList {
                      if (bism) add(q(surah, 0, 1, 1, "البسملة"))
                      for (a in 1..info.ayahs) add(q(surah, a, surah, a, "آية ${Quran.digits(a)}"))
                  }
                  val start = if (startAyah <= 1) 0 else (startAyah - 1) + (if (bism) 1 else 0)
                  c.shuffleModeEnabled = false
                  c.repeatMode = Player.REPEAT_MODE_OFF
                  c.setMediaItems(items, start.coerceIn(items.indices), 0)
                  c.prepare(); c.play()
              }

              fun togglePlay() { controller?.let { if (it.isPlaying) it.pause() else it.play() } }
              fun next() { dir = 1; controller?.seekToNext() }
              fun previous() { dir = -1; controller?.seekToPrevious() }
              fun seek(ms: Long) { controller?.seekTo(ms); position = ms }
              fun toggleShuffle() { controller?.let { it.shuffleModeEnabled = !it.shuffleModeEnabled } }
              fun cycleRepeat() {
                  controller?.let {
                      it.repeatMode = when (it.repeatMode) {
                          Player.REPEAT_MODE_OFF -> Player.REPEAT_MODE_ALL
                          Player.REPEAT_MODE_ALL -> Player.REPEAT_MODE_ONE
                          else -> Player.REPEAT_MODE_OFF
                      }
                  }
              }
          }

          @Composable
          fun rememberPlayerUi(): PlayerUi {
              val ctx = LocalContext.current
              val ui = remember { PlayerUi(ctx.applicationContext) }
              DisposableEffect(Unit) {
                  val f = MediaController.Builder(ctx, SessionToken(ctx, ComponentName(ctx, PlaybackService::class.java))).buildAsync()
                  f.addListener({ runCatching { ui.attach(f.get()) } }, ContextCompat.getMainExecutor(ctx))
                  onDispose { ui.detach(); MediaController.releaseFuture(f) }
              }
              return ui
          }
